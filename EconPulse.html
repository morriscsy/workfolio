<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080b14">
<title>EconPulse — Market Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0: #080b14;
    --bg1: #0d1225;
    --panel: rgba(14,18,32,0.82);
    --panel-solid: #0e1220;
    --glass: rgba(8,11,20,0.72);
    --line: rgba(124,58,237,0.18);
    --line-strong: rgba(124,58,237,0.4);
    --text: #e8eaf0;
    --muted: #a0a8c0;
    --dim: #6b7280;
    --violet: #7c3aed;
    --violet-soft: #a78bfa;
    --cyan: #06b6d4;
    --cyan-soft: #67e8f9;
    --high: #ef4444;
    --high-soft: #f87171;
    --ok: #10b981;
    --ok-soft: #34d399;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; color: var(--text);
    font: 14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    background: linear-gradient(135deg, #080b14 0%, #0d1225 50%, #080b14 100%);
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    filter: blur(10px);
  }
  body::before {
    width: 520px; height: 520px; top: -140px; left: -80px;
    background: radial-gradient(circle, rgba(124,58,237,0.16) 0%, transparent 70%);
  }
  body::after {
    width: 480px; height: 480px; bottom: -120px; right: -60px;
    background: radial-gradient(circle, rgba(6,182,212,0.10) 0%, transparent 70%);
  }
  header, .toolbar, main, .legend { position: relative; z-index: 1; }
  header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 22px 26px 16px; flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 6px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--violet-soft);
    font-weight: 600;
  }
  .brand h1 {
    margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em;
    background: linear-gradient(90deg, #e8eaf0 0%, #a78bfa 55%, #67e8f9 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .brand p { margin: 0; color: var(--muted); font-size: 12px; }
  .nextup {
    background: rgba(8,11,20,0.7);
    border: 1px solid rgba(124,58,237,0.28);
    border-radius: 14px; padding: 12px 16px; min-width: 300px; max-width: 440px;
    box-shadow: 0 0 24px rgba(124,58,237,0.12);
  }
  .nextup .k { font-size: 11px; color: var(--violet-soft); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
  .nextup .v { font-size: 16px; font-weight: 700; margin-top: 3px; }
  .nextup .s { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 26px 14px; flex-wrap: wrap;
  }
  .nav { display: flex; align-items: center; gap: 8px; }
  .nav h2 { margin: 0 6px; font-size: 16px; min-width: 170px; text-align: center; font-weight: 650; }
  button {
    background: rgba(8,11,20,0.7);
    color: #c4c9d6;
    border: 1px solid rgba(124,58,237,0.18);
    border-radius: 10px; padding: 7px 12px; cursor: pointer; font: inherit; font-weight: 600;
  }
  button:hover { border-color: rgba(124,58,237,0.4); color: var(--violet-soft); }
  button.active {
    background: linear-gradient(135deg, rgba(124,58,237,0.35), rgba(6,182,212,0.28));
    border-color: rgba(124,58,237,0.5);
    color: #c4b5fd;
    box-shadow: 0 0 12px rgba(124,58,237,0.25);
  }
  .views, .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  main { display: grid; grid-template-columns: 1fr 340px; flex: 1; min-height: 0; padding: 0 18px 8px; gap: 12px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .cal-wrap { padding: 6px 8px 16px; overflow: auto; }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .dow span { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 6px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    min-height: 118px;
    background: rgba(14,18,32,0.72);
    border: 1px solid rgba(124,58,237,0.14);
    border-radius: 12px; padding: 8px 7px 6px; cursor: pointer;
    display: flex; flex-direction: column; gap: 4px;
  }
  .day:hover { border-color: rgba(124,58,237,0.4); background: rgba(124,58,237,0.08); }
  .day.out { opacity: 0.34; }
  .day.selected {
    border-color: rgba(124,58,237,0.55);
    box-shadow: 0 0 0 1px rgba(6,182,212,0.25), 0 0 18px rgba(124,58,237,0.22);
    background: linear-gradient(180deg, rgba(124,58,237,0.16), rgba(14,18,32,0.8) 50%);
  }
  .day.today { border-color: rgba(6,182,212,0.55); }
  .day.hot { background: linear-gradient(180deg, rgba(239,68,68,0.10), rgba(14,18,32,0.75) 46%); }
  .dnum { font-size: 12px; font-weight: 700; color: var(--muted); }
  .day.today .dnum { color: var(--cyan-soft); }
  .chips { display: flex; flex-direction: column; gap: 3px; }
  .chip {
    font-size: 11px; line-height: 1.25; border-radius: 7px; padding: 3px 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent;
    font-weight: 550;
  }
  .chip.high { background: rgba(239,68,68,0.15); color: #fecaca; border-color: rgba(239,68,68,0.28); }
  .chip.medium { background: rgba(6,182,212,0.12); color: #a5f3fc; border-color: rgba(6,182,212,0.28); }
  .chip.released { opacity: 0.92; }


  .more { font-size: 10px; color: var(--muted); padding-left: 4px; }
  .agenda { display: flex; flex-direction: column; gap: 10px; }
  .aday {
    background: rgba(14,18,32,0.78);
    border: 1px solid rgba(124,58,237,0.16);
    border-radius: 14px; padding: 12px 14px;
  }
  .aday h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 650; }
  .arow { display: grid; grid-template-columns: 92px 64px 1fr; gap: 8px; align-items: start;
    padding: 8px 4px; border-top: 1px dashed rgba(167,139,250,0.18); cursor: pointer; }
  .arow:first-of-type { border-top: 0; }
  .arow:hover { background: rgba(124,58,237,0.08); border-radius: 8px; }
  .arow .t { color: var(--cyan-soft); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; }
  .tag { font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; font-weight: 700;
    padding: 3px 7px; border-radius: 999px; height: fit-content; width: fit-content; }
  .tag.high { background: rgba(239,68,68,0.15); color: var(--high-soft); }
  .tag.medium { background: rgba(6,182,212,0.14); color: var(--cyan-soft); }
  .detail {
    background: rgba(10,13,24,0.88);
    border: 1px solid rgba(124,58,237,0.22);
    border-radius: 16px;
    padding: 18px 18px 20px; overflow: auto;
    box-shadow: 0 0 28px rgba(124,58,237,0.10);
    min-height: 280px;
  }
  .detail h3 { margin: 0 0 4px; font-size: 18px; font-weight: 750; letter-spacing: -0.02em; }
  .detail .meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 7px 10px; font-size: 13px; margin: 12px 0; }
  .kv b { color: var(--muted); font-weight: 550; }
  .empty { color: var(--muted); padding: 24px 8px; }
  .legend { display: flex; gap: 14px; color: var(--muted); font-size: 11px; padding: 4px 26px 16px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  a { color: var(--violet-soft); }


  .flag { width: 16px; height: 11px; border-radius: 2px; display: inline-block; vertical-align: -1px; flex: 0 0 16px; box-shadow: 0 0 0 1px rgba(255,255,255,0.12); overflow: hidden; }
  .chip .flag { margin-right: 1px; }
  .ico { width: 13px; height: 13px; display: inline-block; vertical-align: -2px; flex: 0 0 13px; }
  .chip { display: flex; align-items: center; gap: 4px; }
  .chip .lab { overflow: hidden; text-overflow: ellipsis; }
  .arow { grid-template-columns: 88px 22px 56px 1fr; align-items: center; }
  .legend .lg { display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    border: 1px solid transparent; border-radius: 999px; padding: 3px 8px; }
  .legend .lg:hover, .legend .lg.on { border-color: rgba(124,58,237,0.4); background: rgba(124,58,237,0.12); color: var(--text); }
  .detail-ico { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; }

  .inf-wrap { display: flex; flex-direction: column; gap: 14px; }
  .inf-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
  .inf-head p { margin: 0; color: var(--muted); font-size: 12px; max-width: 640px; }
  .bars { display: flex; flex-direction: column; gap: 5px; }
  .barrow { display: grid; grid-template-columns: 28px 132px 1fr 72px 64px; gap: 8px; align-items: center;
    cursor: pointer; padding: 4px 6px; border-radius: 8px; }
  .barrow:hover, .barrow.on { background: rgba(124,58,237,0.12); }
  .barrow .nm { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { height: 10px; background: rgba(255,255,255,0.05); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; }
  .fill.hot { background: linear-gradient(90deg, #ef4444, #f59e0b); }
  .fill.warm { background: linear-gradient(90deg, #7c3aed, #06b6d4); }
  .fill.cool { background: linear-gradient(90deg, #06b6d4, #34d399); }
  .val { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; }
  .chg { font-size: 11px; font-weight: 650; }
  .chg.up { color: #f87171; }
  .chg.dn { color: #34d399; }
  .chg.flat { color: var(--muted); }
  .outliers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .out { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.28); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
  .out .big { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
  table.inf { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.inf th { text-align: left; color: var(--muted); font-weight: 650; cursor: pointer; padding: 7px 6px; border-bottom: 1px solid rgba(124,58,237,0.2); }
  table.inf td { padding: 7px 6px; border-bottom: 1px dashed rgba(167,139,250,0.12); vertical-align: top; }
  table.inf td.when-td { min-width: 132px; }
  .period { font-weight: 650; }
  .when { font-size: 11px; color: var(--cyan-soft); font-variant-numeric: tabular-nums; font-weight: 650; }
  .when2 { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  table.inf tr { cursor: pointer; }
  table.inf tr:hover, table.inf tr.on { background: rgba(124,58,237,0.1); }



  .chart-wrap { margin: 12px 0 4px; }
  .chart-card {
    background: rgba(8,11,20,0.55);
    border: 1px solid rgba(124,58,237,0.18);
    border-radius: 12px; padding: 10px 10px 8px; margin-bottom: 8px;
  }
  .chart-card h4 { margin: 0 0 6px; font-size: 11px; color: var(--muted); font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; }
  .chart-leg { display: flex; gap: 10px; font-size: 10px; color: var(--muted); margin-top: 6px; }
  .chart-leg i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px; }
  .chart-empty { color: var(--muted); font-size: 12px; padding: 8px 2px; }
  .chart-svg { width: 100%; height: auto; display: block; }
  #toasts {
    position: fixed; right: 18px; bottom: 18px; z-index: 60;
    display: flex; flex-direction: column; gap: 8px; width: min(360px, calc(100vw - 28px));
  }
  .toast {
    background: rgba(10,13,24,0.96);
    border: 1px solid rgba(239,68,68,0.45);
    border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 16px 36px rgba(0,0,0,0.45), 0 0 20px rgba(239,68,68,0.18);
  }
  .toast.t5 { border-color: rgba(245,158,11,0.55); box-shadow: 0 16px 36px rgba(0,0,0,0.45), 0 0 20px rgba(245,158,11,0.18); }
  .toast .k { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #f87171; }
  .toast.t5 .k { color: #fbbf24; }
  .toast .v { font-weight: 750; margin-top: 4px; }
  .toast .s { color: var(--muted); font-size: 12px; margin-top: 3px; }
  #tipcard {
    position: fixed; z-index: 50; width: 360px; max-width: calc(100vw - 20px);
    background: rgba(10,13,24,0.96);
    border: 1px solid rgba(167,139,250,0.4);
    border-radius: 14px; padding: 12px 14px 14px;
    box-shadow: 0 18px 44px rgba(0,0,0,0.5), 0 0 28px rgba(124,58,237,0.2);
    display: none; pointer-events: auto;
  }
  #tipcard.on { display: block; }
  #tipcard .tip-title { font-weight: 750; margin: 7px 0 3px; font-size: 14px; letter-spacing: -0.02em; }
  #tipcard .tip-meta { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  #tipcard p { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
  #tipcard .kv { font-size: 12px; margin: 8px 0; }

  .sheet-head, .sheet-foot, .sheet-close, .sheet-x, .sheet-dim, .sheet-handle { display: none; }
  .sheet-body { min-height: 0; }
  html.sheet-open, html.sheet-open body {
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  html.sheet-open .sheet-body { touch-action: auto; }
  @media (max-width: 800px) {
    html { -webkit-text-size-adjust: 100%; }
    body {
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
    }
    header {
      position: sticky; top: 0; z-index: 12;
      padding: 10px 14px 8px; gap: 8px;
      background: rgba(8,11,20,0.9);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .brand h1 { font-size: 20px; }
    .brand p { display: none; }
    .nextup { min-width: 0; max-width: none; width: 100%; padding: 10px 12px; }
    .nextup .v { font-size: 14px; }
    .toolbar {
      position: sticky; top: 64px; z-index: 11;
      padding: 8px 12px 10px; gap: 8px;
      background: rgba(8,11,20,0.9);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    button {
      min-height: 44px; min-width: 44px;
      padding: 10px 12px; border-radius: 12px;
    }
    .nav { width: 100%; justify-content: space-between; }
    .nav h2 { min-width: 0; flex: 1; font-size: 15px; }
    .views, .filters { width: 100%; }
    .views button, .filters button { flex: 1 1 auto; }
    main {
      display: block;
      padding: 0 12px 16px;
    }
    .cal-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 4px 0 12px; }
    .dow, .grid { min-width: 620px; }
    .day { min-height: 72px; padding: 6px; }
    .chip { min-height: 28px; padding: 6px 7px; font-size: 11px; }
    .arow {
      grid-template-columns: 68px 18px 18px minmax(0,1fr);
      min-height: 44px;
      padding: 12px 6px;
      gap: 8px;
    }
    .arow .tag { display: none; }
    .arow span:last-child { min-width: 0; overflow-wrap: anywhere; }
    .aday { padding: 12px; }
    .legend { padding: 4px 14px 20px; }
    .legend .lg { min-height: 36px; padding: 8px 10px; }
    .mapbox { height: 260px; }
    table.inf { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .inf-head .filters { width: 100%; }
    .sheet-dim.on {
      display: block; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 35;
    }
    .detail {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column;
      max-height: min(92dvh, 92vh);
      min-height: 0;
      overflow: hidden;
      border-radius: 18px 18px 0 0;
      z-index: 40;
      padding: 0;
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--panel-solid);
      transform: translateY(110%);
      transition: transform .22s ease;
      box-shadow: 0 -12px 40px rgba(0,0,0,0.4);
    }
    .detail.open { transform: translateY(0); }
    .sheet-head {
      display: block;
      flex: 0 0 auto;
      position: relative;
      z-index: 2;
      background: var(--panel-solid);
      padding: 8px 52px 8px 16px;
      min-height: 44px;
      border-bottom: 1px solid rgba(124,58,237,0.18);
    }
    .sheet-handle {
      display: block;
      width: 40px; height: 4px; border-radius: 99px;
      background: rgba(167,139,250,0.45);
      margin: 0 auto;
      box-sizing: content-box;
      padding: 14px 48px;
      background-clip: content-box;
      touch-action: none;
    }
    .sheet-x {
      display: flex; align-items: center; justify-content: center;
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      min-width: 44px; min-height: 44px; width: 44px; height: 44px;
      padding: 0; margin: 0; border: none; border-radius: 12px;
      background: transparent; color: var(--violet-soft);
      font-size: 28px; line-height: 1; font-weight: 400;
      -webkit-tap-highlight-color: transparent;
    }
    .sheet-x:hover { color: #fff; background: rgba(124,58,237,0.18); }
    .sheet-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: auto;
      padding: 14px 16px;
    }
    .sheet-foot {
      display: block;
      flex: 0 0 auto;
      z-index: 2;
      background: var(--panel-solid);
      padding: 10px 16px 12px;
      border-top: 1px solid rgba(124,58,237,0.18);
    }
    .sheet-close {
      display: block; width: 100%;
      min-height: 52px;
      margin: 0;
      border-radius: 12px;
      font-size: 17px; font-weight: 700;
      color: #f5f3ff;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      border: 1px solid rgba(167,139,250,0.55);
      box-shadow: 0 0 16px rgba(124,58,237,0.35);
      -webkit-tap-highlight-color: transparent;
    }
    .sheet-close:hover {
      color: #fff;
      border-color: rgba(196,181,253,0.7);
    }
    #tipcard {
      left: 10px !important; right: 10px; width: auto; max-width: none;
      bottom: calc(12px + env(safe-area-inset-bottom));
      top: auto !important;
    }
    #toasts {
      left: 12px; right: 12px; width: auto;
      bottom: calc(12px + env(safe-area-inset-bottom));
    }
  }
  .cal-only.hidden, .inf-only.hidden { display: none !important; }
  .mapbox {
    position: relative;
    background: radial-gradient(ellipse at 50% 40%, rgba(124,58,237,0.10), rgba(8,11,20,0.55) 55%);
    border: 1px solid rgba(124,58,237,0.22);
    border-radius: 16px;
    overflow: hidden;
    height: 430px;
  }
  .mapbox svg { width: 100%; height: 100%; display: block; cursor: grab; }
  .mapbox svg.drag { cursor: grabbing; }
  .land { fill: #2a3348; stroke: #0a0e18; stroke-width: 0.45; }
  .land.has { cursor: pointer; }
  .land.has:hover { filter: brightness(1.18); stroke: #e8eaf0; stroke-width: 1.1; }
  .land.on { stroke: #67e8f9; stroke-width: 1.6; filter: brightness(1.2); }
  .land.pulse { animation: landpulse 1.8s ease-in-out infinite; }
  @keyframes landpulse {
    0%,100% { stroke-width: 0.8; }
    50% { stroke: #67e8f9; stroke-width: 2.1; }
  }
  .map-tip {
    position: absolute; pointer-events: none; display: none; z-index: 4;
    background: rgba(10,13,24,0.94); border: 1px solid rgba(124,58,237,0.45);
    border-radius: 10px; padding: 8px 10px; font-size: 12px; min-width: 148px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.4);
  }
  .map-tip b { display: block; font-size: 13px; margin-bottom: 2px; }
  .map-tools { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; z-index: 3; }
  .map-legend {
    position: absolute; left: 10px; bottom: 10px; z-index: 3;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    background: rgba(8,11,20,0.72); border-radius: 10px; padding: 6px 9px;
    font-size: 10px; color: var(--muted);
  }

function fmtMetric(v, unit) {

function barChart(metrics, compact) {
  const rows = compact ? metrics.slice(0, 2) : metrics;
  const W = compact ? 300 : 300, Hrow = compact ? 78 : 92;
  const left = 78, right = 12, top = 8, base = Hrow - 22;
  const inner = W - left - right;
  let svg = "";

    const vals = [m.previous, m.consensus, m.actual].filter(v => v != null);
    if (!vals.length) return;
    const lo = Math.min(0, ...vals);
    const hi = Math.max(0, ...vals);
    const span = (hi - lo) || 1;
    const pad = span * 0.18;
    const min = lo - pad, max = hi + pad;
    const y0 = top + i * Hrow;
    const scale = v => left + ((v - min) / (max - min)) * inner;
    const zero = scale(0);
    const bars = [
      { v: m.previous, c: "#6b7280", x: 0 },
      { v: m.consensus, c: "#06b6d4", x: 1 },
      { v: m.actual, c: actTone(m), x: 2 }

    bars.forEach(b => {
      if (b.v == null) return;
      const x = scale(Math.min(0, b.v));
      const x2 = scale(Math.max(0, b.v));

      svg += `<text x="${Math.max(x,x2)+6}" y="${by+10}" fill="#e8eaf0" font-size="10">${fmtMetric(b.v,m.unit)}</text>`;
    });

  return `<svg class="chart-svg" viewBox="0 0 ${W} ${h}" width="100%" height="${h}">${svg}</svg>`;

function rateChart(metrics, compact) {

  if (!vals.length) return "";

  const min = Math.min(...vals) - 0.35, max = Math.max(...vals) + 0.35;
  const x = v => 24 + ((v - min) / (max - min)) * (W - 48);
  const marks = [
    { v: m.previous, c: "#6b7280", lab: "Prev" },
    { v: m.consensus, c: "#06b6d4", lab: "Cons" },
    { v: m.actual, c: "#a78bfa", lab: "Act" }

      <text x="${x(k.v)}" y="${i%2?78:32}" text-anchor="middle" fill="${k.c}" font-size="11" font-weight="700">${k.lab} ${fmtMetric(k.v,m.unit)}</text>`;

function infRows() {
  let rows = INFLATION.filter(r => infG20only ? r.g20 : true);
  const chg = r => r.last - r.prev;
  if (infSort === "te") return rows; // Trading Economics capture order
  if (infSort === "last") rows = [...rows].sort((a,b)=>b.last-a.last);
  else if (infSort === "chg") rows = [...rows].sort((a,b)=>chg(b)-chg(a));
  else if (infSort === "next") rows = [...rows].sort((a,b)=>(a.nextDate||a.nextPeriod).localeCompare(b.nextDate||b.nextPeriod) || b.last-a.last);
  else rows = [...rows].sort((a,b)=>a.name.localeCompare(b.name));
  return rows;
}
function infColor(last) {
  if (last == null) return "#2a3348";
  if (last >= 10) return "#ef4444";
  if (last >= 4.0) return "#f59e0b";
  if (last >= 3.0) return "#7c3aed";
  if (last >= 2.0) return "#06b6d4";
  return "#10b981";
}
function chgClass(r) {
  const d = +(r.last - r.prev).toFixed(3);
  if (d > 0.0005) return "up";
  if (d < -0.0005) return "dn";
  return "flat";
}
function chgTxt(r) {
  const d = r.last - r.prev;
  if (Math.abs(d) < 0.0005) return "flat";
  return (d>0?"+":"") + d.toFixed(2);
}

function mapApply() {
  const g = document.getElementById("mapLayer");
  if (g) g.setAttribute("transform", `translate(${mapCam.x},${mapCam.y}) scale(${mapCam.k})`);
}
function mapZoom(f, cx, cy) {
  const box = document.getElementById("mapbox");
  if (!box) return;
  const r = box.getBoundingClientRect();
  const px = (cx == null) ? r.width/2 : cx - r.left;
  const py = (cy == null) ? r.height/2 : cy - r.top;
  const k2 = Math.max(1, Math.min(8, mapCam.k * f));
  const sx = r.width / 960, sy = r.height / 430;
  const s = Math.min(sx, sy);
  const ox = (r.width - 960*s)/2, oy = (r.height - 430*s)/2;
  const mx = (px - ox) / s;
  const my = (py - oy) / s;
  mapCam.x = mx - (mx - mapCam.x) * (k2 / mapCam.k);
  mapCam.y = my - (my - mapCam.y) * (k2 / mapCam.k);
  mapCam.k = k2;
  if (mapCam.k === 1) { mapCam.x = 0; mapCam.y = 0; }
  mapApply();
}
function mapReset() { mapCam = { k: 1, x: 0, y: 0 }; mapApply(); }
function bindMap() {
  const svg = document.getElementById("worldSvg");
  const tip = document.getElementById("mapTip");
  const box = document.getElementById("mapbox");
  if (!svg || !tip || !box) return;
  let drag = null;
  svg.querySelectorAll(".land.has").forEach(el => {
    el.onmousemove = ev => {
      const r = INFLATION.find(x => x.code === el.dataset.code);
      if (!r) return;
      const br = box.getBoundingClientRect();
      tip.style.display = "block";
      tip.style.left = Math.min(br.width - 180, ev.clientX - br.left + 12) + "px";
      tip.style.top = Math.max(8, ev.clientY - br.top - 64) + "px";
      tip.innerHTML = `${flag(r.code)} <b>${r.name}</b>${r.last}% · prev ${r.prev}%<br>ref ${whenText(r.refDate,r.refTime,r.refTz)}<br>next ${whenText(r.nextDate,r.nextTime,r.nextTz)}`;
    };
    el.onmouseleave = () => { tip.style.display = "none"; };
    el.onclick = ev => { ev.stopPropagation(); pickInf(el.dataset.code); };
  });
  svg.onwheel = ev => {
    ev.preventDefault();
    mapZoom(ev.deltaY < 0 ? 1.15 : 0.87, ev.clientX, ev.clientY);
  };
  svg.onmousedown = ev => {
    drag = { x: ev.clientX, y: ev.clientY, ox: mapCam.x, oy: mapCam.y };
    svg.classList.add("drag");
  };
  window.onmouseup = () => { drag = null; svg.classList.remove("drag"); };
  svg.onmousemove = ev => {
    if (!drag) return;
    const br = box.getBoundingClientRect();
    const s = Math.min(br.width / 960, br.height / 430);
    mapCam.x = drag.ox + (ev.clientX - drag.x) / s;
    mapCam.y = drag.oy + (ev.clientY - drag.y) / s;
    mapApply();
  };
}

  const ta = etMinutes(a) - etMinutes(b);
  if (ta) return ta;
  return (a.title || "").localeCompare(b.title || "");
}
function eventsOn(dateStr) {
  return EVENTS.filter(e => e.date === dateStr && visible(e)).sort(byWhen);
}

function nextUpcoming() {
  return EVENTS.filter(e => e.status !== "released" && parse(e.date) >= TODAY)
    .sort(byWhen)[0];
}

function renderNext() {
  const n = nextUpcoming();
  const el = document.getElementById("nextup");
  if (!n) { el.innerHTML = "<div class='k'>Next up</div><div class='v'>Quiet</div>"; return; }
  const days = Math.round((parse(n.date) - TODAY) / 86400000);
  const when = days === 0 ? "today" : days === 1 ? "tomorrow" : `in ${days} days`;
  el.dataset.eid = n.id;
  el.innerHTML = `<div class="k">Next up · ${when}</div>
    <div class="v">${flag(n.country)} ${ico(n.cat)} ${evTitle(n)}</div>
    <div class="s">${n.date.slice(5)} · ${n.time || "time TBD"} ${n.tz} · ${n.country} · ${CATS[n.cat].label}</div>`;
}

function showDetail(ev, dateStr) {
  if (_sheetClosing) return;
  const box = document.getElementById("sheetBody") || document.getElementById("detail");
  if (!ev && dateStr) {
    const list = eventsOn(dateStr);
    if (!list.length) {
      box.innerHTML = `<h3>${parse(dateStr).toLocaleDateString("en-US",{weekday:"long", month:"short", day:"numeric"})}</h3>
        <p class="empty">No events in this filter.</p>`;
      return;
    }
    ev = list[0];
  }
  if (!ev) { box.innerHTML = `<p class="empty">Tap an event.</p>`; return; }
  selectedId = ev.id;
  selectedDate = ev.date;
  const d = parse(ev.date);
  box.innerHTML = `
    <div class="tag ${ev.impact}">${ev.impact}${ev.status==="released"?" · released":""}</div>
    <h3 style="margin-top:10px">${flag(ev.country)} ${ico(ev.cat,"detail-ico")} ${evTitle(ev)}</h3>
    <div class="meta">${d.toLocaleDateString("en-US",{weekday:"long", month:"long", day:"numeric", year:"numeric"})}
      · ${ev.time || "time TBD"} ${ev.tz}${hkStamp(ev) ? " · " + hkStamp(ev) : ""}</div>
    <div class="kv">
      <b>Country</b><span>${flag(ev.country)} ${ev.country} · ${ev.inst}</span>
      <b>Actual</b><span>${ev.actual || "n/a"}</span>
      <b>Consensus</b><span>${ev.consensus}</span>
      <b>Previous</b><span>${ev.previous}</span>
      <b>Vs</b><span>${ev.vs || "n/a"}</span>
      <b>Category</b><span>${ico(ev.cat)} ${CATS[ev.cat].label}</span>
      <b>Status</b><span>${ev.status}</span>
    </div>
    ${renderChart(ev, false)}
    <p>${ev.note}</p>
    <p><a href="${ev.source}" target="_blank" rel="noopener">Source</a></p>
    ${eventsOn(ev.date).filter(x => x.id!==ev.id).map(x =>
      `<div class="arow" data-eid="${x.id}" onclick="pick('${x.id}')"><span class="t">${x.time||"—"}</span>
       ${flag(x.country)}${ico(x.cat)}<span class="tag ${x.impact}">${x.impact}</span><span>${evTitle(x)}</span></div>`).join("")}
  `;
  openSheet();
  render();
}

let _sheetBound = false;
let _sheetScrollY = 0;
let _sheetClosing = false;
function bindSheet() {
  if (_sheetBound) return;
  _sheetBound = true;
  const close = document.getElementById("sheetClose");
  const xBtn = document.getElementById("sheetX");
  const dim = document.getElementById("sheetDim");
  const handle = document.querySelector("#detail .sheet-handle");
  const bindDismiss = (el) => {
    if (!el) return;
    const go = (e) => {
      if (e.type === "touchend") e.preventDefault();
      e.stopPropagation();
      closeSheet();
    };
    el.addEventListener("click", go);
    el.addEventListener("touchend", go, { passive: false });
  };
  bindDismiss(close);
  bindDismiss(xBtn);
  bindDismiss(dim);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.getElementById("detail")?.classList.contains("open")) closeSheet();
  });
  // Swipe-down ONLY on .sheet-handle (not whole head / not Done)
  let startY = null;
  if (handle) {
    handle.addEventListener("touchstart", (e) => {
      startY = e.touches?.[0]?.clientY ?? null;
    }, { passive: true });
    handle.addEventListener("touchmove", (e) => {
      if (startY == null) return;
      const y = e.touches?.[0]?.clientY;
      if (y != null && y - startY > 100) { startY = null; closeSheet(); }
    }, { passive: true });
    handle.addEventListener("touchend", () => { startY = null; });
  }
}
function openSheet() {
  const box = document.getElementById("detail");
  const dim = document.getElementById("sheetDim");
  if (isPhone()) {
    const already = box.classList.contains("open");
    box.classList.add("open");
    if (dim) dim.classList.add("on");
    if (!already) {
      _sheetScrollY = window.scrollY || window.pageYOffset || 0;
      document.documentElement.classList.add("sheet-open");
      document.body.style.top = (-_sheetScrollY) + "px";
      document.body.style.position = "fixed";
      document.body.style.width = "100%";
    }
  }
  bindSheet();
}
function closeSheet() {
  if (_sheetClosing) return;
  _sheetClosing = true;
  const box = document.getElementById("detail");
  const dim = document.getElementById("sheetDim");
  if (box) {
    box.classList.remove("open");
    box.style.pointerEvents = "none";
  }
  if (dim) dim.classList.remove("on");
  document.documentElement.classList.remove("sheet-open");
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.width = "";
  document.body.style.overflow = "";
  window.scrollTo(0, _sheetScrollY || 0);
  // Brief full-screen blocker kills click-through to agenda underneath
  let blocker = document.getElementById("sheetClickBlock");
  if (!blocker) {
    blocker = document.createElement("div");
    blocker.id = "sheetClickBlock";
    blocker.setAttribute("aria-hidden", "true");
    blocker.style.cssText = "position:fixed;inset:0;z-index:55;background:transparent;touch-action:none;";
    document.body.appendChild(blocker);
  }
  blocker.style.display = "block";
  setTimeout(() => {
    if (box) box.style.pointerEvents = "";
    blocker.style.display = "none";
    _sheetClosing = false;
  }, 400);
}

function pick(id) {
  if (_sheetClosing) return;
  const ev = EVENTS.find(e => e.id === id);
  if (ev) showDetail(ev);
}

function monthCells(base) {
  const first = new Date(base.getFullYear(), base.getMonth(), 1);
  const start = new Date(first);
  start.setDate(1 - first.getDay());
  const cells = [];
  for (let i=0;i<42;i++) {
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    cells.push(d);
  }
  return cells;
}

function renderMonth() {
  document.getElementById("dow").innerHTML = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<span>${d}</span>`).join("");
  const board = document.getElementById("board");
  board.className = "grid";
  board.innerHTML = monthCells(cursor).map(d => {
    const id = iso(d);
    const evs = eventsOn(id);
    const out = d.getMonth() !== cursor.getMonth();
    const hot = evs.some(e => e.impact==="high" && e.status!=="released");
    const cls = ["day", out?"out":"", sameDay(d,TODAY)?"today":"", id===selectedDate?"selected":"", hot?"hot":""].filter(Boolean).join(" ");
    const chips = evs.slice(0,3).map(e =>
      `<div class="chip ${e.impact} ${e.status}" data-eid="${e.id}" onclick="event.stopPropagation();pick('${e.id}')">${flag(e.country)}${ico(e.cat)}<span class="lab">${chipLabel(e)}</span></div>`
    ).join("");
    const extra = evs.length>3 ? `<div class="more">+${evs.length-3} more</div>` : "";
    return `<div class="${cls}" onclick="selectDay('${id}')">
      <div class="dnum">${d.getDate()}</div><div class="chips">${chips}${extra}</div></div>`;
  }).join("");
}

function renderWeek() {
  const start = new Date(selectedDate ? parse(selectedDate) : TODAY);
  start.setDate(start.getDate() - start.getDay());
  document.getElementById("dow").innerHTML = "";
  const board = document.getElementById("board");
  board.className = "agenda";
  let html = "";
  for (let i=0;i<7;i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const id = iso(d);
    const evs = eventsOn(id);
    html += `<div class="aday"><h3>${d.toLocaleDateString("en-US",{weekday:"long", month:"short", day:"numeric"})}${sameDay(d,TODAY)?" · today":""}</h3>`;
    if (!evs.length) html += `<p class="empty" style="padding:4px 0">No events</p>`;
    evs.forEach(e => {
      html += `<div class="arow" data-eid="${e.id}" onclick="pick('${e.id}')"><span class="t">${e.time||"—"}</span>
        ${flag(e.country)}${ico(e.cat)}<span class="tag ${e.impact}">${e.impact}</span>
        <span>${evTitle(e)}</span></div>`;
    });
    html += `</div>`;
  }
  board.innerHTML = html;
}

function renderAgenda() {
  document.getElementById("dow").innerHTML = "";
  const board = document.getElementById("board");
  board.className = "agenda";
  const upcoming = EVENTS.filter(e => visible(e) && parse(e.date) >= TODAY);
  const groups = {};
  upcoming.sort(byWhen).forEach(e => { (groups[e.date] ||= []).push(e); });
  board.innerHTML = Object.keys(groups).map(date => {
    const d = parse(date);
    const rows = groups[date].map(e =>
      `<div class="arow" data-eid="${e.id}" onclick="pick('${e.id}')"><span class="t">${e.time||"—"}</span>
       ${flag(e.country)}${ico(e.cat)}<span class="tag ${e.impact}">${e.impact}</span>
       <span>${evTitle(e)} <span style="color:var(--muted)">· ${e.inst}</span></span></div>`
    ).join("");
    return `<div class="aday"><h3>${d.toLocaleDateString("en-US",{weekday:"long", month:"short", day:"numeric"})}</h3>${rows}</div>`;
  }).join("") || `<p class="empty">Nothing ahead in this filter.</p>`;
}

function render() {
  setChrome();
  if (view === "inflation") { renderInflation(); pickInf(infSel); return; }
  document.getElementById("monthLabel").textContent = monthName(cursor);
  if (view === "month") renderMonth();
  else if (view === "week") renderWeek();
  else renderAgenda();
}

function selectDay(id) {
  if (_sheetClosing) return;
  selectedDate = id;
  cursor = parse(id);
  const list = eventsOn(id);
  showDetail(list[0] || null, id);
}

document.getElementById("prev").onclick = () => {
  if (view === "week") { cursor.setDate(cursor.getDate()-7); selectedDate = iso(cursor); }
  else cursor.setMonth(cursor.getMonth()-1);
  render();
};
document.getElementById("next").onclick = () => {
  if (view === "week") { cursor.setDate(cursor.getDate()+7); selectedDate = iso(cursor); }
  else cursor.setMonth(cursor.getMonth()+1);
  render();
};
document.getElementById("todayBtn").onclick = () => { cursor = new Date(TODAY); selectedDate = iso(TODAY); render(); showDetail(null, iso(TODAY)); };
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
  view = b.dataset.view;
  document.querySelectorAll("[data-view]").forEach(x => x.classList.toggle("active", x===b));
  render();
});
document.querySelectorAll("[data-imp]").forEach(b => b.onclick = () => {
  impact = b.dataset.imp;
  document.querySelectorAll("[data-imp]").forEach(x => x.classList.toggle("active", x===b));
  render();
  if (selectedId) pick(selectedId);
});


document.querySelectorAll("#catLegend .lg[data-cat]").forEach(b => {
  if (b.dataset.cat !== "all") b.innerHTML = ico(b.dataset.cat) + " " + CATS[b.dataset.cat].label;
  b.onclick = () => {
    catFilter = b.dataset.cat;
    document.querySelectorAll("#catLegend .lg[data-cat]").forEach(x => x.classList.toggle("on", x===b));
    render();
    if (selectedId) pick(selectedId);
  };
});
function tipHTML(ev) {
  const d = parse(ev.date);
  return `
    <div class="tag ${ev.impact}">${ev.impact}${ev.status==="released"?" · released":""}</div>
    <div class="tip-title">${flag(ev.country)} ${ico(ev.cat)} ${evTitle(ev)}</div>
    <div class="tip-meta">${d.toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric"})}
      · ${ev.time || "time TBD"} ${ev.tz}${hkStamp(ev) ? " · " + hkStamp(ev) : ""} · ${ev.inst}</div>
    <div class="kv">
      <b>Actual</b><span>${ev.actual || "n/a"}</span>
      <b>Consensus</b><span>${ev.consensus}</span>
      <b>Previous</b><span>${ev.previous}</span>
      <b>Vs</b><span>${ev.vs || "n/a"}</span>
    </div>
    ${renderChart(ev, true)}
    <p>${ev.note}</p>`;
}
let tipTimer = 0;
let tipId = "";
function placeTip(anchor) {
  const card = document.getElementById("tipcard");
  const r = anchor.getBoundingClientRect();
  const w = card.offsetWidth || 360;
  const h = card.offsetHeight || 220;
  let left = r.left;
  let top = r.bottom + 8;
  if (left + w > window.innerWidth - 16) left = window.innerWidth - w - 16;
  if (left < 10) left = 10;
  if (top + h > window.innerHeight - 12) top = r.top - h - 8;
  if (top < 10) top = 10;
  card.style.left = left + "px";
  card.style.top = top + "px";
}
function showTip(id, anchor) {
  const ev = EVENTS.find(e => e.id === id);
  const card = document.getElementById("tipcard");
  if (!ev || !card) return;
  tipId = id;
  card.innerHTML = tipHTML(ev);
  card.classList.add("on");
  placeTip(anchor);
}
function hideTip(force) {
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => {
    if (force || !document.getElementById("tipcard").matches(":hover")) {
      document.getElementById("tipcard").classList.remove("on");
      tipId = "";
    }
  }, force ? 0 : 120);
}
function bindTips() {
  if (isCoarse() || isPhone()) return;
  document.querySelectorAll("[data-eid]").forEach(el => {
    el.onpointerenter = () => {
      clearTimeout(tipTimer);
      tipTimer = setTimeout(() => showTip(el.dataset.eid, el), 80);
    };
    el.onpointerleave = () => hideTip();
  });
  const card = document.getElementById("tipcard");
  card.onpointerenter = () => clearTimeout(tipTimer);
  card.onpointerleave = () => hideTip();
}
const _render = render;
render = function() {
  _render();
  if (view !== "inflation") bindTips();
  if (location.hash.startsWith("#tip=")) {
    const id = decodeURIComponent(location.hash.slice(5));
    const el = document.querySelector(`[data-eid="${id}"]`);
    if (el) showTip(id, el);
  }
};


function eventInstant(ev) {
  const p = parseClock(ev.time || "");
  if (!p) return null;
  return zonedInstant(ev.date, p.h, p.min, "America/New_York");
}
function toastSeen(key) {
  try { return localStorage.getItem("ep-alert-"+key) === "1"; } catch (e) { return false; }
}
function toastMark(key) {
  try { localStorage.setItem("ep-alert-"+key, "1"); } catch (e) {}
}
function pushToast(ev, kind) {
  const key = ev.id + "-" + kind;
  if (toastSeen(key)) return;
  toastMark(key);
  const box = document.getElementById("toasts");
  if (!box) return;
  const el = document.createElement("div");
  el.className = "toast " + (kind === 5 ? "t5" : "");
  el.innerHTML = `<div class="k">T-${kind} · ${ev.impact}</div>
    <div class="v">${flag(ev.country)} ${ico(ev.cat)} ${evTitle(ev)}</div>
    <div class="s">${ev.time || "time TBD"} ${ev.tz}${hkStamp(ev) ? " · " + hkStamp(ev) : ""} · ${ev.inst}</div>`;
  box.appendChild(el);
  setTimeout(() => el.remove(), 90000);
}
function checkPrintAlerts() {
  const now = Date.now();
  EVENTS.forEach(ev => {
    if (ev.status === "released") return;
    const t = eventInstant(ev);
    if (t == null) return;
    const mins = (t - now) / 60000;
    if (mins > 13.5 && mins <= 16.5) pushToast(ev, 15);
    if (mins > 3.5 && mins <= 6.5) pushToast(ev, 5);
  });
}
setInterval(checkPrintAlerts, 15000);
checkPrintAlerts();

bindSheet();
document.querySelectorAll("[data-view]").forEach(x => x.classList.toggle("active", x.dataset.view === view));
renderNext();
render();
if (!(isPhone() && !location.hash.startsWith("#ev="))) {
  const bootId = location.hash.startsWith("#ev=") ? location.hash.slice(4) : (nextUpcoming()?.id || selectedId);
  if (bootId) pick(bootId);
}

</script>
